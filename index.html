<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Acmes Media" />
    <meta name="theme-color" content="#080808" />

    <!--
      Title, description, canonical, Open Graph, Twitter and JSON-LD are NOT set here.
      Each page renders its own via <Seo> / <SchemaScript>, and the build prerenders
      them into every route's HTML (scripts/prerender.mjs). Static copies here would
      ship alongside them as conflicting duplicates.
    -->

    <!-- Favicon -->
    <link rel="icon" href="/acmes_media_logo.png" />
    <!-- <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" /> -->
    <!-- Add to Home Screen / PWA install disabled — not needed for this site -->
    <!-- <link rel="manifest" href="/site.webmanifest" /> -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet" />
    <!-- Google Analytics 4. Skipped on localhost so dev traffic never reaches the property.
         src/lib/track.js sends the custom /sales events through window.gtag. -->
    <script>
      (function () {
        var host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1') return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        // Consent: analytics cookies stay off until the visitor accepts (CookieNotice).
        window.gtag('consent', 'default', {
          analytics_storage: 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });
        try {
          if (localStorage.getItem('cookie_consent') === 'granted') {
            window.gtag('consent', 'update', { analytics_storage: 'granted' });
          }
        } catch (e) { /* storage blocked */ }
        window.gtag('config', 'G-YXDNYS0JNV');
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YXDNYS0JNV';
        document.head.appendChild(s);
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
